[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "botaudit"
version = "1.0.0"
description = "CLI tool that grades how accessible a website is to AI clients"
readme = "README.md"
license = "CC-BY-NC-4.0"
requires-python = ">=3.11"
authors = [
    { name = "Nicholas Crook", email = "43064732+NiCrook@users.noreply.github.com" },
]
keywords = ["ai", "accessibility", "seo", "audit", "cli", "llm"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: Other/Proprietary License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP",
]
dependencies = [
    "httpx",
    "beautifulsoup4",
]

[project.urls]
Homepage = "https://github.com/NiCrook/botaudit"
Repository = "https://github.com/NiCrook/botaudit"
Issues = "https://github.com/NiCrook/botaudit/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/botaudit"]

[project.scripts]
botaudit = "botaudit.cli:main"
